<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLAZA Negocios · inteligencia de mercado PR</title>
<style>
  :root{
    --bg:#0b0e11; --panel:#11161b; --panel2:#161d24; --line:#232d36;
    --ink:#e8eef2; --dim:#8fa1ad; --faint:#5a6b76;
    --sol:#ffd400; --flam:#ff5a3c; --mamey:#2fd6a3; --sea:#3aa6ff; --uva:#c792ff;
    --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--mono);padding:0 0 60px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{display:flex;align-items:baseline;gap:16px;padding:26px 0 6px;border-bottom:1px solid var(--line)}
  .logo{font-size:30px;font-weight:800;letter-spacing:-1px}
  .logo b{color:var(--sol)}
  .tag{color:var(--dim);font-size:12px}
  .demo{margin-left:auto;font-size:10px;padding:3px 9px;border:1px solid var(--sol);color:var(--sol);border-radius:3px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:24px 0}
  .kpi{background:var(--panel);padding:14px 16px}
  .kpi .v{font-size:26px;font-weight:800;color:var(--sol)}
  .kpi .v.g{color:var(--mamey)} .kpi .v.b{color:var(--sea)} .kpi .v.u{color:var(--uva)}
  .kpi .l{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line)}
  .card>h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:14px 18px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:10px 18px;border-bottom:1px solid var(--line)}
  td{padding:9px 18px;border-bottom:1px solid var(--panel2)}
  tr:last-child td{border-bottom:none}
  .bar{height:8px;background:var(--mamey);border-radius:2px;display:inline-block;vertical-align:middle;margin-right:8px}
  .num{color:var(--sol);font-weight:700}
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;display:flex;justify-content:space-between}
  .funnel-step{background:var(--panel2);padding:10px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px}
  .sel{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px 10px;margin:14px 18px 0}
  canvas.chart{width:100%;height:170px;display:block;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">PLA<b>ZA</b> <span style="font-size:14px;color:var(--dim);font-weight:400">NEGOCIOS</span></div>
    <div class="tag">inteligencia de mercado · supermercados de Puerto Rico</div>
    <div class="demo">● DATOS SINTÉTICOS — DEMO</div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <h2>Actividad semanal de usuarios</h2>
      <canvas class="chart" id="activity"></canvas>
    </div>
    <div class="card">
      <h2>Embudo de uso (usuarios únicos)</h2>
      <div id="funnel"></div>
    </div>
  </div>

  <div class="grid" style="margin-top:20px">
    <div class="card">
      <h2>Búsquedas top</h2>
      <table id="topsearch"><tbody></tbody></table>
    </div>
    <div class="card">
      <h2>Engagement por cadena (clics en ofertas)</h2>
      <table id="chains"><tbody></tbody></table>
    </div>
  </div>

  <div class="card" style="margin-top:20px">
    <h2>Marca: atención semanal y conversión</h2>
    <select class="sel" id="brandsel" onchange="loadBrand()"></select>
    <canvas class="chart" id="brandchart"></canvas>
    <table id="brandconv"><tbody></tbody></table>
  </div>

  <div class="foot">
    <span>PLAZA NEGOCIOS · demo para cadenas y marcas</span>
    <span id="note"></span>
  </div>
</div>

<script>
const API = (location.hostname.endsWith('netlify.app') || location.protocol==='file:')
  ? 'https://plaza-pr-api.fly.dev' : '';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const KIND_ES = {search:'búsquedas', list_add:'añadidos a lista', basket_view:'vistas de canasta', offer_click:'clics en ofertas'};

function bar(v, max, color){ return `<span class="bar" style="width:${Math.max(2,Math.round(120*v/max))}px;background:${color||'var(--mamey)'}"></span>`; }

function drawSeries(canvasId, labels, values, color){
  const cv = $(canvasId), ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth*2, H = cv.height = cv.clientHeight*2;
  ctx.clearRect(0,0,W,H);
  if(!values.length) return;
  const max = Math.max(...values), min = Math.min(...values, 0), pad = (max-min)*0.1||1;
  const x = i => 60 + i*((W-90)/Math.max(values.length-1,1));
  const y = v => H-30 - ((v-(min-pad))/((max+pad)-(min-pad)))*(H-60);
  ctx.strokeStyle='#232d36'; ctx.fillStyle='#5a6b76'; ctx.font='18px monospace';
  ctx.beginPath(); ctx.moveTo(50,10); ctx.lineTo(50,H-30); ctx.lineTo(W-20,H-30); ctx.stroke();
  ctx.fillText(String(max), 6, 26); ctx.fillText(String(min), 6, H-30);
  labels.forEach((l,i)=>{ if(i%Math.ceil(labels.length/8)===0) ctx.fillText(String(l).slice(5), x(i)-18, H-8); });
  ctx.strokeStyle=color||'#2fd6a3'; ctx.lineWidth=3; ctx.beginPath();
  values.forEach((v,i)=>{ const X=x(i),Y=y(v); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.stroke();
  values.forEach((v,i)=>{ ctx.fillStyle=color||'#2fd6a3'; ctx.beginPath(); ctx.arc(x(i),y(v),4,0,7); ctx.fill(); });
}

async function load(){
  const d = await (await fetch(API+'/api/b2b/overview')).json();
  $('#note').textContent = d.note;
  const totalUsers = Math.max(...d.funnel.map(f=>f.users));
  const totalEvents = d.weekly_activity.reduce((a,r)=>a+r.n,0);
  const searches = d.weekly_activity.filter(r=>r.kind==='search').reduce((a,r)=>a+r.n,0);
  const clicks = d.chain_engagement.reduce((a,r)=>a+r.clicks,0);
  $('#kpis').innerHTML = `
    <div class="kpi"><div class="v">${totalUsers}</div><div class="l">usuarios activos</div></div>
    <div class="kpi"><div class="v g">${totalEvents}</div><div class="l">eventos (8 semanas)</div></div>
    <div class="kpi"><div class="v b">${searches}</div><div class="l">búsquedas</div></div>
    <div class="kpi"><div class="v u">${clicks}</div><div class="l">clics en ofertas</div></div>
    <div class="kpi"><div class="v">${d.chain_engagement.length}</div><div class="l">cadenas con engagement</div></div>`;

  // weekly activity: total per week
  const weeks = [...new Set(d.weekly_activity.map(r=>r.week))].sort();
  const totals = weeks.map(w=>d.weekly_activity.filter(r=>r.week===w).reduce((a,r)=>a+r.n,0));
  drawSeries('#activity', weeks, totals, '#3aa6ff');

  const ORDER = ['search','list_add','basket_view','offer_click'];
  $('#funnel').innerHTML = ORDER.map(k=>{
    const f = d.funnel.find(x=>x.kind===k); if(!f) return '';
    return `<div class="funnel-step"><span>${KIND_ES[k]}</span><span class="num">${f.users}</span></div>`;
  }).join('');

  const maxN = Math.max(...d.top_searches.map(r=>r.n));
  $('#topsearch').querySelector('tbody').innerHTML =
    `<tr><th>término</th><th>búsquedas</th><th>usuarios</th></tr>` +
    d.top_searches.map(r=>`<tr><td>${esc(r.product_norm)}</td>
      <td>${bar(r.n,maxN)}<span class="num">${r.n}</span></td><td>${r.users}</td></tr>`).join('');

  const maxC = Math.max(...d.chain_engagement.map(r=>r.clicks));
  $('#chains').querySelector('tbody').innerHTML =
    `<tr><th>cadena</th><th>clics</th><th>usuarios</th></tr>` +
    d.chain_engagement.map(r=>`<tr><td style="font-weight:700">${r.chain_slug}</td>
      <td>${bar(r.clicks,maxC,'#ffd400')}<span class="num">${r.clicks}</span></td><td>${r.users}</td></tr>`).join('');

  // brand selector from brand_weekly
  const brands = [...new Set(d.brand_weekly.map(r=>r.brand))].filter(Boolean).sort();
  $('#brandsel').innerHTML = brands.map(b=>`<option>${b}</option>`).join('');
  loadBrand();
}

async function loadBrand(){
  const b = $('#brandsel').value;
  const d = await (await fetch(API+'/api/b2b/brand/'+encodeURIComponent(b))).json();
  const weeks = d.attention_weekly.map(r=>r.week);
  const vals = d.attention_weekly.map(r=>r.n);
  drawSeries('#brandchart', weeks, vals, '#c792ff');
  $('#brandconv').querySelector('tbody').innerHTML =
    `<tr><th>evento</th><th>total</th></tr>` +
    d.conversion.map(r=>`<tr><td>${KIND_ES[r.kind]||r.kind}</td><td class="num">${r.n}</td></tr>`).join('') +
    `<tr><td style="color:var(--faint)">ofertas activas de la marca (real)</td><td class="num">${d.current_prices.length}</td></tr>`;
}

load();
</script>
</body>
</html>
